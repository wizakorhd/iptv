name: Refresh EPG (guide.xml.gz)

# The EPG grab is location-independent (program data, not geo-restricted streams),
# so it runs here on GitHub's runners instead of the Mac — that keeps the ~460 MB
# iptv-org/epg clone + node_modules off local disk. This workflow OWNS guide.xml.gz.
#
# The playlist is curated + geo-validated locally from India (scripts/auto-build.sh)
# and is NOT rebuilt here. File ownership is disjoint (local owns playlists + site;
# this Action owns guide.xml.gz) so the two schedulers never conflict.

on:
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC daily (~07:30 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-epg
  cancel-in-progress: true

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build guide.xml.gz from epg.channels.xml
        run: ./build_epg.sh 20 3

      - name: Commit refreshed guide
        run: |
          git config user.name  "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh EPG guide ($(date -u +%Y-%m-%d))"
            # local job may push playlists concurrently; disjoint files -> rebase-retry is safe
            for i in 1 2 3; do
              git push && break
              echo "push rejected (attempt $i); rebasing"
              git fetch origin main && git rebase origin/main || { git rebase --abort; break; }
            done
          else
            echo "guide unchanged"
          fi

