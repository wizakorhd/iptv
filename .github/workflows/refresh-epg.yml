name: Refresh EPG (guide.xml.gz)

# The EPG grab is location-independent (program data, not geo-restricted streams),
# so it runs here on GitHub's runners. This workflow OWNS guide.xml.gz.
#
# The playlist is curated + geo-validated separately (see the playlist workflow /
# local build). File ownership is disjoint (the playlist build owns the playlists +
# site; this Action owns guide.xml.gz) so the two never conflict.

on:
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC daily (~07:30 IST)
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: refresh-epg
  cancel-in-progress: true

jobs:
  epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Build guide.xml.gz from epg.channels.xml
        # The iptv-org grabber buffers all parsed programs before writing; Node's
        # default ~4 GB heap OOMs on our ~2000 feeds. Runner has 16 GB, so lift the
        # cap (inherited by the node child that npm spawns).
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: ./build_epg.sh 20 3

      - name: Commit refreshed guide
        run: |
          git config user.name  "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh EPG guide ($(date -u +%Y-%m-%d))"
            # local job may push playlists concurrently; disjoint files -> rebase-retry is safe
            for i in 1 2 3; do
              git push && break
              echo "push rejected (attempt $i); rebasing"
              git fetch origin main && git rebase origin/main || { git rebase --abort; break; }
            done
          else
            echo "guide unchanged"
          fi

