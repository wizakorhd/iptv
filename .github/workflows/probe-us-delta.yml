name: TEMP probe US-vs-India delta

# Temporary: builds the playlist on a GitHub US runner and uploads the result as
# an artifact (never commits). Used once to measure how many channels survive
# validation from the US vs from India. Delete after measuring.

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: probe-us-delta
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build playlist (validated from US runner)
        run: python3 generate_playlist.py

      - name: Show report summary
        run: |
          echo '----- REPORT.md (top) -----'
          head -20 REPORT.md || true
          echo '----- kept count -----'
          python3 -c "import json;print('US kept ids:', len(json.load(open('curated_ids.json'))))"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: us-build
          path: |
            curated_ids.json
            REPORT.md
            playlist.m3u
          retention-days: 1
