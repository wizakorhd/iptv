name: Refresh playlist (self-hosted, India)

# Rebuilds the geo-validated playlist AND the EPG on a self-hosted runner located
# in India, then commits everything.
#
# WHY self-hosted: streams are validated by probing them from the runner's
# network. GitHub's hosted runners are in the US, so they would drop India-only
# channels and keep US-only ones (i.e. break the "no-VPN-from-India" guarantee).
#
# NOTE: the local macOS launchd job (scripts/auto-build.sh) already does this
# from your India-connected Mac and is the PRIMARY builder. This workflow is an
# alternative for people who prefer an Actions-driven flow with a registered
# self-hosted India runner; its daily schedule is disabled to avoid double-push
# churn with the launchd job. Trigger manually from the Actions tab if desired.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "EPG days to grab"
        default: "3"

permissions: {}

concurrency:
  group: refresh-playlist
  cancel-in-progress: true

jobs:
  build:
    # runner must be registered with these labels (see README)
    runs-on: [self-hosted, india]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build validated playlist (from India)
        run: python3 generate_playlist.py

      - name: Build EPG config
        run: python3 generate_epg_config.py

      - name: Grab EPG (+ epgshare merge + gzip)
        # inputs.days is untrusted -> pass via env, never interpolate into the shell
        env:
          EPG_DAYS: ${{ github.event.inputs.days || '3' }}
        run: ./build_epg.sh 15 "${EPG_DAYS}"

      - name: Regenerate site data
        run: python3 gen_site.py

      - name: Commit results
        run: |
          git config user.name  "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add playlist*.m3u curated_ids.json epg.channels.xml \
                  guide.xml.gz REPORT.md docs/channels.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-refresh playlist + EPG ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "nothing changed"
          fi
