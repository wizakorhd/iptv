name: Refresh playlist (self-hosted)

# Rebuilds the geo-validated playlist AND the EPG on a self-hosted runner, then
# commits everything.
#
# WHY self-hosted: streams are validated by probing them from the runner's
# network, so the runner should sit on a connection in the target region.
# GitHub-hosted runners live in a different region and would drop region-locked
# channels and keep ones that only work elsewhere.
#
# This is an optional Actions-driven alternative to a periodic build; its daily
# schedule is disabled to avoid double-push churn. Trigger it manually from the
# Actions tab if you have a suitable self-hosted runner registered.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "EPG days to grab"
        default: "3"

permissions: {}

concurrency:
  group: refresh-playlist
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build validated playlist
        run: python3 generate_playlist.py

      - name: Build EPG config
        run: python3 generate_epg_config.py

      - name: Grab EPG (+ epgshare merge + gzip)
        # inputs.days is untrusted -> pass via env, never interpolate into the shell
        env:
          EPG_DAYS: ${{ github.event.inputs.days || '3' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: ./build_epg.sh 15 "${EPG_DAYS}"

      - name: Regenerate site data
        run: python3 gen_site.py

      - name: Commit results
        run: |
          git config user.name  "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add playlist*.m3u curated_ids.json epg.channels.xml \
                  guide.xml.gz REPORT.md docs/channels.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-refresh playlist + EPG ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "nothing changed"
          fi
