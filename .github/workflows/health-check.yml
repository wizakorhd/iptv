name: Channel health check

# Weekly re-validation of playlist streams. Opens/updates a single tracking issue
# listing unreachable channels. Probes run from the runner (US region), so treat
# geo-restricted results as a hint, not proof — see the issue body.

on:
  schedule:
    - cron: "0 6 * * 1"     # 06:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe streams
        run: python3 check_health.py

      - name: Upsert tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('health-report.md', 'utf8');
            const title = 'Channel health report';
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'health', per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.data[0].number,
                title, body,
              });
            } else {
              // ensure the label exists (ignore error if it already does)
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: 'health', color: 'd29922',
                  description: 'Automated stream health reports',
                });
              } catch (e) {}
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['health'],
              });
            }
